# Publishes the demo workspace at https://gostatementnssitsolution.github.io/zycount/
#
# Two jobs on purpose. A job that names the `github-pages` environment cannot
# start until that environment exists, and it only exists once Pages has been
# turned on — so `enable` turns it on first (that is what `enablement: true`
# does), and `deploy` runs after it.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true

  deploy:
    needs: enable
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
