services:
  postgres:
    image: postgres:16-alpine
    container_name: zycount-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zycount
      POSTGRES_PASSWORD: zycount
      POSTGRES_DB: zycount
    ports:
      - "5432:5432"
    volumes:
      - zycount-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zycount"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zycount-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - zycount-redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: zycount-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zycount
      MINIO_ROOT_PASSWORD: zycount-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - zycount-miniodata:/data

volumes:
  zycount-pgdata:
  zycount-redisdata:
  zycount-miniodata:
